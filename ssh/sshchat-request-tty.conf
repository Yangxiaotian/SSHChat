# SSHChat — request a TTY even when a remote command is given.
# Without this, ``ssh user@localhost free`` skips PTY allocation: the local
# ssh stays in cooked mode and Tab completion never reaches chat.sh/client.py.
# "yes" = request a TTY when local stdin is a terminal (same as ssh -t).
Host localhost 127.0.0.1 ::1
    RequestTTY yes
