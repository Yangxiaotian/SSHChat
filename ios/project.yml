name: SSHChat
options:
  bundleIdPrefix: chat.ssh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Citadel:
    path: Packages/Citadel
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
targets:
  SSHChat:
    type: application
    platform: iOS
    sources:
      - SSHChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.ssh.SSHChat
        PRODUCT_NAME: SSHChat
        MARKETING_VERSION: "0.3.6"
        CURRENT_PROJECT_VERSION: "19"
        INFOPLIST_KEY_CFBundleDisplayName: SSHChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JVKAWTMQZ4
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Citadel
        product: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIO
    info:
      path: SSHChat/Info.plist
      properties:
        CFBundleDisplayName: SSHChat
        CFBundleShortVersionString: "0.3.6"
        CFBundleVersion: "19"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: SSHChat 需要相机以拍照或录像发送到聊天。
        NSMicrophoneUsageDescription: SSHChat 需要麦克风以录制语音消息。
        NSPhotoLibraryUsageDescription: SSHChat 需要访问相册以选择图片发送。
        NSLocalNetworkUsageDescription: SSHChat 通过 SSH 连接聊天服务器。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
